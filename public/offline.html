<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taurus offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg-top: #ecfeff;
        --bg-bottom: #f0fdfa;
        --text: #0f172a;
        --muted: #334155;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text);
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(15, 118, 110, 0.25);
        border-radius: 16px;
        padding: 28px;
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin-top: 12px;
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Taurus could not reach the network. Previously visited screens are still available while your connection is down.</p>
      <p>Reconnect and refresh this page to sync the latest data.</p>
      <p><a href="/">Back to Taurus</a></p>
    </main>
  </body>
</html>
