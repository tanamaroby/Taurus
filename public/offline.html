<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taurus offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg-top: #ecfeff;
        --bg-bottom: #f8fafc;
        --text: #0f172a;
        --muted: #334155;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(45, 212, 191, 0.18), transparent 32%),
          radial-gradient(circle at top right, rgba(96, 165, 250, 0.16), transparent 30%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text);
        padding: 24px;
      }

      main {
        width: min(620px, 100%);
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(15, 118, 110, 0.18);
        border-radius: 24px;
        padding: 28px;
        backdrop-filter: blur(8px);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 1.7rem;
        letter-spacing: -0.03em;
      }

      p {
        margin-top: 12px;
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
        border: 1px solid rgba(15, 118, 110, 0.18);
        background: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Taurus could not reach the network. Previously visited screens may still open from cache, and planner drafts are saved locally on this device.</p>
      <p>Reconnect and refresh this page to sync the latest data.</p>
      <div class="actions">
        <a href="/">Back to Taurus</a>
        <a href="/changelog">Open changelog</a>
      </div>
    </main>
  </body>
</html>
